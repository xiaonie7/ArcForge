// v2 统一线协议（WebSocket+Protobuf）：/ws/v2（浏览器）、/ws/v2/agent（桌面端）、
// /ws/v2/terminal（终端数据面）三链路的帧壳。一条 WS 二进制消息承载一条帧，文本帧即协议错误；
// 首帧必须为 hello，鉴权失败以 close code 4401 关闭。业务载荷复用 v1 消息（三端唯一事实源，
// 永不弃用、编号只增不改），本文件仅新增帧壳与未曾 proto 化的网关本地载荷。
syntax = "proto3";

package liveagent.gateway.v2;

import "proto/v1/gateway.proto";

option go_package = "github.com/liveagent/agent-gateway/internal/proto/v2;gatewayv2";

// ---------------------------------------------------------------------------
// 握手
// ---------------------------------------------------------------------------

// ClientRole 区分 /ws/v2/terminal 上连接的所属端（该链路两端共用一条路径，靠 hello.role 区分）。
enum ClientRole {
  CLIENT_ROLE_UNSPECIFIED = 0;
  CLIENT_ROLE_BROWSER = 1;
  CLIENT_ROLE_AGENT = 2;
  CLIENT_ROLE_CHANNEL = 3;
}

// ClientHello 是所有 v2 连接的第一帧。
message ClientHello {
  // 协议版本，当前恒为 2；未知版本被服务端拒绝。
  uint32 protocol_version = 1;
  ClientRole role = 2;
  // 网关访问令牌，服务端做常量时间比较。
  string token = 3;
  // 以下字段仅 CLIENT_ROLE_AGENT 使用（对应 v1 gRPC AuthRequest）。
  string agent_id = 4;
  string agent_version = 5;
  // 客户端标识（如 "webui" / "desktop"），仅用于观测与日志。
  string client_name = 6;
  string client_version = 7;
  // CHANNEL connections are bound to one authenticated connector and bot.
  string channel_tenant_id = 8;
  string channel_bot_id = 9;
  string connector_id = 10;
  // Zero means legacy: no binding lifecycle support. Version one implements
  // durable close/query and lazy session creation over this authenticated link.
  uint32 channel_lifecycle_version = 11;
  // Zero means the connector receives only the canonical final answer.
  // Version one opts into transient ChannelProgress frames for a live
  // "processing" indicator; they are never part of the delivered message.
  uint32 channel_progress_version = 12;
}

// ServerHello 是服务端对 ClientHello 的应答；ok=false 时随即关闭连接。
message ServerHello {
  bool ok = 1;
  string message = 2;
  // 仅 agent 角色返回（对应 v1 gRPC AuthResponse.session_id）。
  string session_id = 3;
  // 服务端 Unix 秒时间戳，供客户端校准。
  int64 server_time = 4;
  // 服务端心跳周期与消息大小上限，客户端应据此配置本地看门狗与分片。
  uint32 heartbeat_period_seconds = 5;
  uint64 max_message_bytes = 6;
}

// PingFrame / PongFrame 是应用层心跳：WS 控制帧 ping 探测网络栈，本帧探测页面 JS/事件循环存活。
message PingFrame {
  int64 timestamp = 1;
}

message PongFrame {
  int64 timestamp = 1;
}

// AckResult 是本地操作的通用确认应答（对应 v1 的 {"ok":true}）。
message AckResult {
  bool ok = 1;
}

// ---------------------------------------------------------------------------
// 浏览器链路（/ws/v2）
// ---------------------------------------------------------------------------

// WebClientFrame 为浏览器 → 网关方向的帧。除 agent_request 直通臂外，其余臂均为
// 网关本地操作（由网关自身状态应答，不经桌面端往返）。
message WebClientFrame {
  // 请求关联 id，客户端生成、响应帧回携；广播事件与心跳帧为空。
  string request_id = 1;

  oneof payload {
    ClientHello hello = 2;
    // 直通请求：网关校验白名单与限额后转发桌面端（request_id 按连接命名空间化防冲突）。
    liveagent.gateway.v1.GatewayEnvelope agent_request = 3;
    StatusGetRequest status_get = 4;
    liveagent.gateway.v1.ChatCommandRequest chat_command = 5;
    ChatPrepareRequest chat_prepare = 6;
    ChatSubscribeRequest chat_subscribe = 7;
    ChatUnsubscribeRequest chat_unsubscribe = 8;
    ChatActivitiesRequest chat_activities = 9;
    WorkspaceSubscribeRequest workspace_subscribe = 10;
    WorkspaceUnsubscribeRequest workspace_unsubscribe = 11;
    PongFrame pong = 12;
  }
}

// WebServerFrame 为网关 → 浏览器方向的帧。
message WebServerFrame {
  // 关联响应回填请求 id；服务端主动推送（广播/心跳）时为空。
  string request_id = 1;

  oneof payload {
    ServerHello hello = 2;
    // 直通响应：桌面端返回的 v1 信封（含 error=99 错误臂）。
    liveagent.gateway.v1.AgentEnvelope agent_response = 3;
    // 网关本地错误（鉴权、校验、离线等；对应 v1 的 type:"error" 信封）。
    liveagent.gateway.v1.ErrorResponse local_error = 4;
    PingFrame ping = 5;
    // status_get / chat_prepare 的响应与 status 广播共用，新旧客户端共享一个状态归一化器。
    StatusEvent status = 6;
    ChatSubscribeResult chat_subscribed = 7;
    ChatCommandAccepted chat_accepted = 8;
    ChatActivitiesResult chat_activities = 9;
    ChatStreamEvent chat_event = 10;
    ChatCommandUpdate chat_command_update = 11;
    ChatSubscriptionReset chat_subscription_reset = 12;
    ChatActivityEvent chat_activity = 13;
    AckResult ack = 14;
    ChatCancelResult chat_cancelled = 15;

    // 广播事件：session 层吐出的 v1 seam 消息零塑形直转。
    liveagent.gateway.v1.HistorySyncEvent history_event = 20;
    liveagent.gateway.v1.SettingsSyncEvent settings_event = 21;
    liveagent.gateway.v1.TerminalEvent terminal_event = 22;
    liveagent.gateway.v1.SftpEvent sftp_event = 23;
    liveagent.gateway.v1.ChatQueueEvent chat_queue_event = 24;
    liveagent.gateway.v1.TunnelStateSnapshot tunnel_state = 25;
    liveagent.gateway.v1.ManagedProcessSnapshot process_state = 26;
    liveagent.gateway.v1.WorkspaceActivityEvent workspace_activity = 27;
  }
}

// ---------------------------------------------------------------------------
// 桌面端链路（/ws/v2/agent，替代 v1 gRPC Authenticate + AgentConnect）
// ---------------------------------------------------------------------------

// AgentClientFrame 为桌面端 → 网关方向的帧。
message AgentClientFrame {
  oneof payload {
    ClientHello hello = 1;
    liveagent.gateway.v1.AgentEnvelope envelope = 2;
  }
}

// AgentServerFrame 为网关 → 桌面端方向的帧。
message AgentServerFrame {
  oneof payload {
    ServerHello hello = 1;
    liveagent.gateway.v1.GatewayEnvelope envelope = 2;
  }
}

// ---------------------------------------------------------------------------
// Restricted channel link (/ws/v2/channel).
// ---------------------------------------------------------------------------

// ChannelInboundMessage contains only channel-authenticated message metadata.
// Conversation ids, workdirs, roles, scopes, models and tools are intentionally
// absent: the gateway and desktop policy layer resolve them from this identity.
message ChannelInboundFile {
  string file_name = 1;
  string mime_type = 2;
  bytes content = 3;
}

message ChannelInboundMessage {
  string external_message_id = 1;
  string external_user_id = 2;
  string chat_id = 3;
  // WeCom values are "single" and "group".
  string chat_type = 4;
  string text = 5;
  int64 timestamp = 6;
  // Restricted control command parsed by the Connector. The Gateway accepts
  // only its built-in allowlist; arbitrary desktop command types are never
  // exposed on this channel.
  string command = 7;
  // Connector-owned opaque session id, isolated by channel user/chat. It
  // changes on /new while the authenticated principal remains unchanged.
  string channel_session_id = 8;
  // Connector-downloaded WeCom attachments. The gateway validates bounded
  // inline bytes, then stages them through UploadReadableFiles before the chat
  // command is accepted by the desktop runtime.
  repeated ChannelInboundFile files = 9;
  string channel_scope_key = 10;
  uint64 channel_session_generation = 11;
}

message ChannelAccepted {
  string external_message_id = 1;
  string run_id = 2;
  string conversation_id = 3;
  bool deduped = 4;
}

// ChannelDelta exposes visible assistant text. Tool calls, thinking and
// arbitrary tool results are never forwarded; only the separately validated
// PresentFile artifact path below can produce ChannelFile frames.
message ChannelDelta {
  string run_id = 1;
  string conversation_id = 2;
  int64 seq = 3;
  string text = 4;
}

// ChannelFile carries one completed PresentFile artifact. File contents are
// read by the desktop only after its workspace-relative path and all expected
// metadata have been revalidated.
message ChannelFile {
  string run_id = 1;
  string conversation_id = 2;
  int64 seq = 3;
  string file_name = 4;
  string mime_type = 5;
  uint64 size_bytes = 6;
  bytes content = 7;
  string error_code = 8;
  string message = 9;
}

message ChannelFinal {
  string run_id = 1;
  string conversation_id = 2;
  string status = 3;
  string error_code = 4;
  string message = 5;
}

// ChannelProgress is a transient activity signal for connectors that opted in
// through ClientHello.channel_progress_version. It lets an external chat show
// what the run is doing while it is still running. Connectors must render it
// only in an in-place "processing" placeholder that the final answer replaces;
// it is never persisted, replayed as history, or appended to ChannelDelta.
//
// kind is one of:
//   thinking  - a model reasoning fragment (delta text, bounded)
//   text      - a visible assistant text fragment (delta text, bounded)
//   tool_call - the model started a tool; text carries only the tool name
//   status    - a coarse runtime status such as "compacting"
// Tool arguments and tool results are never forwarded.
message ChannelProgress {
  string run_id = 1;
  string conversation_id = 2;
  int64 seq = 3;
  string kind = 4;
  string text = 5;
  int64 round = 6;
}

// The restricted channel exposes only AskUserQuestion's user-facing fields.
// IDs are gateway-generated opaque aliases; desktop tool/question/option IDs
// and labels never cross back from an untrusted channel answer.
message ChannelInputOption {
  string id = 1;
  string label = 2;
  string description = 3;
  bool recommended = 4;
}

message ChannelInputQuestion {
  string id = 1;
  string header = 2;
  string prompt = 3;
  repeated ChannelInputOption options = 4;
}

message ChannelInputRequest {
  string interaction_id = 1;
  string run_id = 2;
  string conversation_id = 3;
  int64 seq = 4;
  int64 deadline_at_ms = 5;
  repeated ChannelInputQuestion questions = 6;
}

message ChannelInputAnswerSelection {
  string question_id = 1;
  string option_id = 2;
}

message ChannelInputAnswer {
  string interaction_id = 1;
  repeated ChannelInputAnswerSelection selections = 2;
}

message ChannelInputAnswerResult {
  string interaction_id = 1;
  bool accepted = 2;
  string status = 3;
  string message = 4;
}

message ChannelInputResolved {
  string interaction_id = 1;
  string status = 2;
  repeated ChannelInputAnswerSelection selections = 3;
  string message = 4;
}

message ChannelClientFrame {
  string request_id = 1;

  oneof payload {
    ClientHello hello = 2;
    ChannelInboundMessage inbound = 3;
    PongFrame pong = 4;
    ChannelInputAnswer input_answer = 5;
    liveagent.gateway.v1.ChannelBindingResponse binding_response = 6;
    ChannelSessionSnapshot binding_snapshot = 7;
  }
}

message ChannelServerFrame {
  string request_id = 1;

  oneof payload {
    ServerHello hello = 2;
    ChannelAccepted accepted = 3;
    ChannelDelta delta = 4;
    ChannelFinal final = 5;
    liveagent.gateway.v1.ErrorResponse local_error = 6;
    PingFrame ping = 7;
    ChannelFile file = 8;
    ChannelInputRequest input_request = 9;
    ChannelInputAnswerResult input_answer_result = 10;
    ChannelInputResolved input_resolved = 11;
    liveagent.gateway.v1.ChannelBindingRequest binding_request = 12;
    ChannelProgress progress = 13;
  }
}

// ---------------------------------------------------------------------------
// 终端链路（/ws/v2/terminal，两端共用；替代浏览器自定义二进制帧与 v1 gRPC AgentTerminalConnect）
// ---------------------------------------------------------------------------

// TerminalClientFrame 为客户端（浏览器或桌面端）→ 网关方向的帧。
message TerminalClientFrame {
  oneof payload {
    ClientHello hello = 1;
    liveagent.gateway.v1.TerminalStreamFrame frame = 2;
  }
}

// TerminalServerFrame 为网关 → 客户端方向的帧。
message TerminalServerFrame {
  oneof payload {
    ServerHello hello = 1;
    liveagent.gateway.v1.TerminalStreamFrame frame = 2;
  }
}

// ---------------------------------------------------------------------------
// 网关本地载荷（v1 JSON 协议时代以 Go 结构体/手写 map 存在，此处 proto 化）
// ---------------------------------------------------------------------------

// StatusGetRequest 请求网关侧运行状态快照（对应 v1 "status.get"）。
message StatusGetRequest {}

// StatusEvent 镜像 session.Status 的 JSON 形状（字段一一对应）。
message StatusEvent {
  bool online = 1;
  bool agent_ready = 2;
  bool chat_runtime_ready = 3;
  string agent_id = 4;
  string agent_version = 5;
  string session_id = 6;
  int64 connected_since = 7;
  int64 last_heartbeat = 8;
  string runtime_state = 9;
  int64 runtime_last_heartbeat = 10;
  string runtime_worker_id = 11;
  bool runtime_visible = 12;
  uint32 runtime_active_run_count = 13;
}

// ChatPrepareRequest 唤醒/探活桌面端 chat 运行时（对应 v1 "chat.prepare"）；响应为 StatusEvent。
message ChatPrepareRequest {
  string reason = 1;
}

// ChatSubscribeRequest 订阅会话事件流（对应 v1 "chat.subscribe"）。after_seq + stream_epoch
// 支持断线重放：epoch 不匹配或序号超界时服务端置 reset 并从头回放。
message ChatSubscribeRequest {
  string conversation_id = 1;
  int64 after_seq = 2;
  string stream_epoch = 3;
}

// ChatRunActivity 镜像 session.RunActivity 的 JSON 形状。
message ChatRunActivity {
  string run_id = 1;
  string state = 2;
  int64 started_seq = 3;
  // Unix 毫秒时间戳。
  int64 updated_at_ms = 4;
  string tool_status = 5;
  bool tool_status_is_compaction = 6;
  string client_request_id = 7;
  // 以下两个字段仅在 chat_activities 列表中填充。
  string conversation_id = 8;
  string workdir = 9;
}

// ChatRunSnapshot 镜像 session.RunSnapshot 的 JSON 形状。
message ChatRunSnapshot {
  string run_id = 1;
  int64 revision = 2;
  // 桌面端渲染快照，内容为动态 JSON（与 v1 一致按字符串携带，不建模）。
  string entries_json = 3;
  string tool_status = 4;
  bool tool_status_is_compaction = 5;
  int64 as_of_seq = 6;
}

// ChatSubscribeResult 是 chat_subscribe 的响应。
message ChatSubscribeResult {
  string conversation_id = 1;
  string stream_epoch = 2;
  int64 latest_seq = 3;
  bool reset = 4;
  ChatRunActivity activity = 5;
  ChatRunSnapshot snapshot = 6;
  // 回放的事件序列。载荷由 chatwire 塑形为深度动态 JSON，与 v1 一致按字节携带、不 proto 化
  // （重建模会分叉 chatwire 且对压缩后的二进制帧无实际收益）。
  repeated bytes events_json = 7;
}

// ChatUnsubscribeRequest 取消订阅（对应 v1 "chat.unsubscribe"）；响应 AckResult。
message ChatUnsubscribeRequest {
  string conversation_id = 1;
}

// ChatActivitiesRequest 查询运行中会话（对应 v1 "chat.activities"）；仅由网关状态应答，桌面端离线时亦可用。
message ChatActivitiesRequest {}

message ChatActivitiesResult {
  repeated ChatRunActivity running_conversations = 1;
}

// ChatStreamEvent 是订阅后推送的单条会话事件。
message ChatStreamEvent {
  string conversation_id = 1;
  // 事件序号（与 payload_json 内的 seq 一致，便于不解析载荷即可去重）。
  int64 seq = 2;
  bytes payload_json = 3;
}

// ChatCommandAccepted 是 chat_command 提交被接受的响应（对应 v1 chat.command 的应答形状）。
message ChatCommandAccepted {
  string run_id = 1;
  string conversation_id = 2;
  int64 accepted_seq = 3;
  bool deduped = 4;
}

// ChatCommandUpdate 推送命令阶段结果。除前置阶段 bound / queued_in_gui / failed 外，
// durable dedupe 重放 completed / cancelled / unknown 终态。
message ChatCommandUpdate {
  string run_id = 1;
  string client_request_id = 2;
  string conversation_id = 3;
  string phase = 4;
  string error_code = 5;
  string message = 6;
  // True when the Desktop run had started before this terminal transition.
  // Clients must preserve the submitted user message in that case even if a
  // priority command update overtakes the ordered conversation stream.
  bool run_started = 7;
}

// ChatSubscriptionReset 通知客户端某会话流已被限流丢弃，需重新订阅（after_seq 断点续传）。
message ChatSubscriptionReset {
  string conversation_id = 1;
}

// ChatCancelResult 是 chat.cancel 的响应。
message ChatCancelResult {
  bool ok = 1;
  string run_id = 2;
  string conversation_id = 3;
}

// ChatActivityEvent 广播会话活动状态变化，镜像 session.ConversationActivityEvent。
message ChatActivityEvent {
  string conversation_id = 1;
  string run_id = 2;
  string client_request_id = 3;
  bool running = 4;
  string state = 5;
  string workdir = 6;
  int64 updated_at_ms = 7;
}

// WorkspaceSubscribeRequest 订阅工作区活动（对应 v1 "workspace.subscribe"）；响应 AckResult，事件经 workspace_activity 臂广播。
message WorkspaceSubscribeRequest {
  string workdir = 1;
}

// WorkspaceUnsubscribeRequest 取消订阅；响应 AckResult。
message WorkspaceUnsubscribeRequest {
  string workdir = 1;
}

// A bounded batch of existing routing identities, without conversation IDs.
// The authenticated Gateway derives IDs using the unchanged provider adapter.
message ChannelSessionSnapshot {
  repeated ChannelInboundMessage bindings = 1;
}
